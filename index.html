<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestor Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu lateral em ameixa com arcos suaves + área de trabalho areia; cantos bem arredondados.
   Acento = malva. Verde-sálvia = receita, terracota = despesa, ocre = alerta. */
:root{
  --font-display:'Cormorant Garamond','Georgia',serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#f5ede3; --surface:#fffaf4; --surface-2:#f2e8dc; --line:#e6d8c7; --line-strong:#cdb9a3;
  --fg:#3a2a2d; --muted:#7b6568; --faint:#a08b87;
  --accent:#8c4a6b; --accent-hover:#733a56; --accent-fg:#fff8f2; --accent-soft:#f0dde4;
  --inc:#4d7556; --inc-soft:#dfead8; --exp:#b4402f; --exp-soft:#f6ddd3; --warn:#94650f; --warn-soft:#f6e6c2;
  --side-bg:#4a2b3d; --side-fg:#e8d3d6; --side-strong:#fff8f2; --side-active:#613a4f; --side-line:#68455a;
  --overlay:rgba(48,26,36,.55); --shadow:0 18px 48px rgba(48,26,36,.3);
  --c1:#8c4a6b; --c2:#c4623f; --c3:#5f8a73; --c4:#c9962e; --c5:#d4788a; --c6:#7f8f45; --c7:#5b6fa0; --c8:#9a7b6a; --c9:#a35b86; --c10:#b4402f; --c11:#8f8480;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1519; --surface:#2a1d23; --surface-2:#34252d; --line:#46333c; --line-strong:#5d4650;
  --fg:#f3e6e2; --muted:#c0a9a8; --faint:#8f7a7b;
  --accent:#e0a0bd; --accent-hover:#eab5ce; --accent-fg:#3a1a2a; --accent-soft:#4a2b3d;
  --inc:#9ccd9f; --inc-soft:#2b3e2e; --exp:#f09a82; --exp-soft:#4a261f; --warn:#e9be64; --warn-soft:#42341a;
  --side-bg:#170e12; --side-fg:#cdb5b6; --side-strong:#fff8f2; --side-active:#2c1c25; --side-line:#38252e;
  --overlay:rgba(0,0,0,.65); --shadow:0 18px 48px rgba(0,0,0,.5);
  --c1:#e0a0bd; --c2:#f09a6e; --c3:#8fcdb0; --c4:#ebc063; --c5:#f2a2b3; --c6:#b8c86f; --c7:#9fb2e6; --c8:#c9aa98; --c9:#d79ac0; --c10:#f09a82; --c11:#b0a5a0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1519; --surface:#2a1d23; --surface-2:#34252d; --line:#46333c; --line-strong:#5d4650;
  --fg:#f3e6e2; --muted:#c0a9a8; --faint:#8f7a7b;
  --accent:#e0a0bd; --accent-hover:#eab5ce; --accent-fg:#3a1a2a; --accent-soft:#4a2b3d;
  --inc:#9ccd9f; --inc-soft:#2b3e2e; --exp:#f09a82; --exp-soft:#4a261f; --warn:#e9be64; --warn-soft:#42341a;
  --side-bg:#170e12; --side-fg:#cdb5b6; --side-strong:#fff8f2; --side-active:#2c1c25; --side-line:#38252e;
  --overlay:rgba(0,0,0,.65); --shadow:0 18px 48px rgba(0,0,0,.5);
  --c1:#e0a0bd; --c2:#f09a6e; --c3:#8fcdb0; --c4:#ebc063; --c5:#f2a2b3; --c6:#b8c86f; --c7:#9fb2e6; --c8:#c9aa98; --c9:#d79ac0; --c10:#f09a82; --c11:#b0a5a0;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .inc{color:var(--inc)} .exp{color:var(--exp)} .warn{color:var(--warn)}
.right{text-align:right} .nowrap{white-space:nowrap} .grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- shell ---- */
.shell{min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:70;background:var(--side-bg);color:var(--side-fg);transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:65;background:var(--overlay);display:none}
.scrim.open{display:block}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;color:var(--side-strong);font-family:var(--font-display);font-weight:700;font-size:1.08rem}
.brand svg{flex:none}
.navgrp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
.nav:hover{background:var(--side-active);color:var(--side-strong)}
.nav[aria-current="page"]{background:var(--side-active);color:var(--side-strong);box-shadow:inset 0 0 0 1px var(--side-line)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto}
.badge{background:var(--exp);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--faint);border-top:1px solid var(--side-line)}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;background:var(--surface);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .badge{position:absolute;top:-6px;right:-6px}
.savestate{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:default;padding:4px 6px;border-radius:6px}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--inc);display:inline-block}
.savestate[data-s="saving"] i{background:var(--warn)} .savestate[data-s="error"] i{background:var(--exp)} .savestate[data-s="error"]{cursor:pointer;color:var(--exp)}
.content{max-width:1240px;margin:0 auto;padding:18px 0 56px;display:flex;flex-direction:column;gap:16px}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:252px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:0;height:100vh;transform:none;width:auto;transition:none;padding-left:max(14px,env(safe-area-inset-left,0px))}
  .menu-btn{display:none}.scrim{display:none!important}
  .main{padding-left:28px;padding-right:28px}
  .top{margin:0 -28px;padding:12px 28px}
}

/* ---- blocos ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h2,.panel-h h3{font-size:1.02rem}
.sub{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.gwide{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
@media (max-width:720px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:500;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpi.hero .l,.kpi.hero .s{color:inherit;opacity:.86}
.kpi.hero .v{font-size:1.85rem}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--inc)} .delta.down{color:var(--exp)} .delta.flat{color:var(--muted)}

/* ---- botões e campos ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)} .btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--exp);border-color:var(--exp)} .btn.danger.solid{background:var(--exp);color:#fff}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:999px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.inp,.field input,.field select,.field textarea,.sel{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--fg);min-width:0}
.field textarea{min-height:66px;resize:vertical}
.field input[type=checkbox],.field input[type=radio]{width:auto}
.field input:disabled,.field select:disabled{background:var(--surface-2);color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .sel{width:auto;max-width:100%}
.filters input[type=search]{width:min(100%,220px)}

/* ---- pills e barras ---- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.inc{background:var(--inc-soft);color:var(--inc);border-color:transparent}
.pill.exp{background:var(--exp-soft);color:var(--exp);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.prog{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prog.inc>i{background:var(--inc)} .prog.exp>i{background:var(--exp)} .prog.warn>i{background:var(--warn)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}

/* ---- listas ---- */
.rows{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:minmax(0,1fr) 112px 128px auto;gap:6px 12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .t{font-weight:500;overflow-wrap:anywhere}
.tx .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tx .val{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.tx .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:720px){.tx{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d v" "s a"}.tx .d{grid-area:d}.tx .st{grid-area:s}.tx .val{grid-area:v}.tx .acts{grid-area:a}}
.empty{border:1px dashed var(--line-strong);border-radius:20px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--fg);font-size:1.05rem}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;min-width:480px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-strong);font-weight:600}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.alert{display:flex;gap:10px;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);align-items:flex-start}
.alert .ic{width:8px;align-self:stretch;border-radius:4px;background:var(--faint);flex:none}
.alert.danger{background:var(--exp-soft);border-color:transparent} .alert.danger .ic{background:var(--exp)}
.alert.warn{background:var(--warn-soft);border-color:transparent} .alert.warn .ic{background:var(--warn)}
.alert.ok{background:var(--inc-soft);border-color:transparent} .alert.ok .ic{background:var(--inc)}
.alert.info{background:var(--accent-soft);border-color:transparent} .alert.info .ic{background:var(--accent)}
.alert .at{font-weight:600} .alert .ax2{font-size:13px;color:var(--muted)}

/* ---- gráficos ---- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--muted);font:500 10.5px var(--font-mono)}
.gl{stroke:var(--line);stroke-width:1} .zl{stroke:var(--line-strong);stroke-width:1}
.b-inc{fill:var(--inc)} .b-exp{fill:var(--exp)} .bar:hover{opacity:.78}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round} .ln.proj{stroke-dasharray:6 5}
.area{fill:var(--accent);opacity:.09}
.pt{fill:var(--surface);stroke:var(--accent);stroke-width:2} .pt.end{fill:var(--accent)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:168px;height:168px;flex:none}
.donut-leg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.donut-leg div{display:flex;gap:8px;align-items:center;font-size:13px}
.catbar{display:grid;grid-template-columns:minmax(0,130px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:260px;display:none;line-height:1.35}

/* ---- calendário ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal button.day{min-height:62px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:11px;overflow:hidden}
.cal button.day.out{opacity:.4} .cal button.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal button.day[aria-pressed="true"]{background:var(--accent-soft)}
.cal .dn{font-weight:600;font-size:12px}
.cal .ev{font-family:var(--font-mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.cal button.day{min-height:46px}.cal .ev{display:none}}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%}

/* ---- wishlist ---- */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wimg{aspect-ratio:16/9;max-width:100%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wimg .ph{font-family:var(--font-display);font-size:2.6rem;font-weight:700;color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.wbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.wbody h3{font-size:1.02rem;overflow-wrap:anywhere}

/* ---- modal e toast ---- */
.mback{position:fixed;inset:0;z-index:80;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:24px;width:100%;max-width:580px;max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dlg.wide{max-width:820px}
.dlg>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg>header h2{font-size:1.1rem}
.dlg-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.ferr{color:var(--exp);font-size:13px;background:var(--exp-soft);padding:8px 10px;border-radius:8px}
#toastRoot{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:560px}
.toast .btn{color:var(--bg);border-color:var(--bg)}
.chatlog{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:92%;padding:9px 12px;border-radius:20px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.msg.a p+p{margin-top:6px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

<script>
/* =====================================================================
   NÚCLEO: utilitários, datas, dinheiro, estado e armazenamento
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

/* dinheiro: valores guardados em reais com 2 casas; somas feitas em centavos */
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const sum = (arr, f) => arr.reduce((a, x) => a + Math.round((Number(f ? f(x) : x) || 0) * 100), 0) / 100;
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = n => BRL.format(r2(n));
const num1 = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR');
const pctf = n => num1(n) + '%';
const compact = n => Math.round(Math.abs(n)).toLocaleString('pt-BR');
function parseMoney(v) {
  let s = String(v == null ? '' : v).trim().replace(/R\$|\s| /g, '');
  if (!s || /[^0-9.,-]/.test(s)) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  else if (/^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace('.', '');
  const n = Number(s);
  return isFinite(n) ? r2(n) : NaN;
}
const inputMoney = n => (n === '' || n == null || isNaN(n)) ? '' : r2(n).toFixed(2).replace('.', ',');

/* datas: sempre texto AAAA-MM-DD; exibição DD/MM/AAAA */
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MES3 = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const pad = n => String(n).padStart(2, '0');
const fmtYMD = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const daysIn = (y, m) => new Date(y, m, 0).getDate();
function todayStr() { const d = new Date(); return fmtYMD(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
const curMonth = () => todayStr().slice(0, 7);
function validDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return false;
  const y = +m[1], mo = +m[2], d = +m[3];
  return y >= 1990 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= daysIn(y, mo);
}
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : '—'; };
const ymOf = s => String(s).slice(0, 7);
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number); const t = y * 12 + (m - 1) + n;
  const ny = Math.floor(t / 12), nm = t % 12 + 1; return fmtYMD(ny, nm, Math.min(d, daysIn(ny, nm)));
}
function addDays(s, n) { const t = new Date(utc(s) + n * 864e5); return fmtYMD(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
const addYM = (m, n) => addMonths(m + '-01', n).slice(0, 7);
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const monthLabel = m => MESES[+m.slice(5, 7) - 1] + ' de ' + m.slice(0, 4);
const monthShort = m => MES3[+m.slice(5, 7) - 1] + '/' + m.slice(2, 4);
const endOfMonth = m => m + '-' + pad(daysIn(+m.slice(0, 4), +m.slice(5, 7)));
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
function weekday(s) { return new Date(utc(s)).getUTCDay(); }
function monthsBetween(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }

/* listas fixas */
const CAT_D = ['Moradia', 'Alimentação', 'Transporte', 'Saúde', 'Educação', 'Lazer', 'Compras', 'Assinaturas', 'Contas básicas', 'Dívidas', 'Outros'];
const CAT_R = ['Salário', 'Freelance', 'Investimentos', 'Vendas', 'Benefícios', 'Reembolso', 'Outros'];
const CAT_W = ['Eletrônicos', 'Casa', 'Viagem', 'Moda', 'Veículo', 'Educação', 'Lazer', 'Saúde', 'Experiências', 'Outros'];
const FORMA_D = ['Pix', 'Cartão de crédito', 'Cartão de débito', 'Dinheiro', 'Boleto', 'Transferência'];
const FORMA_R = ['Pix', 'Transferência', 'Dinheiro', 'Boleto', 'Depósito'];
const DISCRETIONARY = ['Lazer', 'Compras', 'Assinaturas'];
const catColor = c => { const i = CAT_D.indexOf(c); return `var(--c${(i < 0 ? 10 : i) + 1})`; };
const PRIO = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const PRIO_W = { alta: 0, media: 1, baixa: 2 };
const WSTATUS = { desejado: 'Desejado', planejado: 'Planejado', economia: 'Em economia', adquirido: 'Adquirido', cancelado: 'Cancelado' };
const GTIPOS = {
  economia: { nome: 'Economia mensal', cat: 'Economia', auto: true },
  limite: { nome: 'Limite máximo de despesas', cat: 'Despesas', auto: true },

  quitacao: { nome: 'Quitação de dívidas', cat: 'Dívidas', auto: true },

};
const GSTATUS = { nao_iniciada: 'Não iniciada', andamento: 'Em andamento', concluida: 'Concluída', nao_atingida: 'Não atingida' };

/* ícones do menu */
const ICON = {
  painel: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

  despesas: '<path d="M12 20V7M6 13l6-6 6 6M4 3h16"/>',
  contas: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
  dividas: '<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>',
  planejamento: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  metas: '<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
  wishlist: '<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M12 8v13M5 13v8h14v-8M8 8C5.5 8 5.5 4 8 4c3 0 4 4 4 4s1-4 4-4c2.5 0 2.5 4 0 4"/>',
  relatorios: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  assistente: '<path d="M4 5h16v11H9l-5 4z"/>',
  backup: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k] || ''}</svg>`;

/* =====================================================================
   ESTADO
   ===================================================================== */
const KEY = 'gestor-financeiro:v1';
function emptyState() {
  return { v: 1, settings: { alertDias: 3, metaEconomiaMensal: 0, metaEconomiaAnual: 0, ultimoBackup: null, criadoEm: todayStr() },
    accounts: [], tx: [], faturaPag: [], budgets: {}, debts: [], goals: [], wishlist: [] };
}
let S = emptyState();
const newF = () => ({ mode: 'mes', ref: curMonth(), de: '', ate: '', cat: '', status: '', q: '', lim: 80 });
const U = {
  view: 'painel', side: false, dashMonth: curMonth(), f: { receitas: newF(), despesas: newF() },
  calMonth: curMonth(), calDay: null, planMonth: curMonth(), repGran: 'mes', repRef: todayStr(),
  chat: [], metaMonth: curMonth(), metaAll: false, cartaoSel: '', simPct: 15, simCat: '',
  wf: { cat: '', status: '', ord: 'prioridade', group: false, q: '' }, undo: null, busyAI: false
};

/* normaliza qualquer estado carregado (nuvem, navegador ou backup) */
function normalizeState(raw) {
  const s = emptyState(); if (!raw || typeof raw !== 'object') return s;
  const arr = v => Array.isArray(v) ? v.filter(x => x && typeof x === 'object') : [];
  Object.assign(s.settings, raw.settings && typeof raw.settings === 'object' ? raw.settings : {});
  s.accounts = arr(raw.accounts); s.tx = arr(raw.tx); s.faturaPag = arr(raw.faturaPag);
  s.debts = arr(raw.debts); s.goals = arr(raw.goals); s.wishlist = arr(raw.wishlist);
  s.budgets = raw.budgets && typeof raw.budgets === 'object' ? raw.budgets : {};
  s.tx.forEach(t => { t.valor = r2(t.valor); if (!t.id) t.id = uid(); });
  return s;
}

/* ---- armazenamento: nuvem (conta do usuário) com reserva no navegador ---- */
const Store = { mode: 'local', col: null, last: {}, queue: Promise.resolve(), dirty: false, timer: null, status: 'saved' };

function toShards(st) {
  const o = {};
  o.meta = { settings: st.settings, accounts: st.accounts, budgets: st.budgets, faturaPag: st.faturaPag };
  o.debts = { items: st.debts }; o.goals = { items: st.goals };
  st.wishlist.forEach(w => { o['wish_' + w.id] = w; });
  const byM = {};
  st.tx.forEach(t => { const k = 'tx_' + ymOf(t.data || todayStr()); (byM[k] = byM[k] || []).push(t); });
  Object.keys(byM).forEach(k => { o[k] = { items: byM[k] }; });
  return o;
}
function fromShards(map) {
  const raw = { tx: [], wishlist: [] };
  Object.keys(map).forEach(k => {
    const d = map[k];
    if (k === 'meta') Object.assign(raw, d);
    else if (k === 'debts') raw.debts = d.items;
    else if (k === 'goals') raw.goals = d.items;
    else if (k.startsWith('wish_')) raw.wishlist.push(d);
    else if (k.startsWith('tx_')) raw.tx.push(...(d.items || []));
  });
  return normalizeState(raw);
}
function setSaveState(s, msg) {
  Store.status = s; const b = $('#saveState'); if (!b) return; b.dataset.s = s;
  $('#saveTxt').textContent = msg || ({ saved: Store.mode === 'cloud' ? 'Salvo na sua conta' : 'Salvo neste navegador', saving: 'Salvando…', error: 'Erro ao salvar. Tentar de novo' }[s]);
}
function schedulePersist() { Store.dirty = true; setSaveState('saving'); clearTimeout(Store.timer); Store.timer = setTimeout(flush, 450); }
function flush() { clearTimeout(Store.timer); Store.queue = Store.queue.then(doFlush); return Store.queue; }
async function doFlush() {
  if (!Store.dirty) return; Store.dirty = false;
  try {
    if (Store.mode === 'cloud') {
      const shards = toShards(S), sets = [], dels = [];
      Object.keys(shards).forEach(k => { const j = JSON.stringify(shards[k]); if (Store.last[k] !== j) sets.push([k, shards[k], j]); });
      Object.keys(Store.last).forEach(k => { if (!(k in shards)) dels.push(k); });
      for (const [k, v, j] of sets) { await writeRetry(() => Store.col.doc(k).set(v)); Store.last[k] = j; }
      for (const k of dels) { await writeRetry(() => Store.col.doc(k).delete()); delete Store.last[k]; }
    } else {
      localStorage.setItem(KEY, JSON.stringify(S));
    }
    if (!Store.dirty) setSaveState('saved');
  } catch (e) {
    Store.dirty = true; setSaveState('error');
    clearTimeout(Store.timer); Store.timer = setTimeout(flush, 15000);
    if (e && e.code === 'quota_exceeded') toast('Limite de armazenamento atingido. Exclua dados antigos ou faça um backup.');
  }
}
async function writeRetry(fn) { try { await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 900 + Math.random() * 600)); await fn(); } else throw e; } }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

async function loadStorage(forceLocal) {
  let db = null, id = null;
  if (!forceLocal && window.claude && window.claude.use) {
    try { db = await window.claude.use('db'); const user = await window.claude.use('user'); id = user ? await user.id() : null; } catch (e) { db = null; }
  }
  if (db && id) {
    Store.mode = 'cloud'; Store.col = db.collection('data/users/' + id);
    const snap = await withTimeout(Store.col.get(), 10000);   // erro aqui vira tela de nova tentativa
    const map = {}; Store.last = {};
    snap.docs.forEach(d => { const data = d.data(); if (data) { map[d.id] = data; Store.last[d.id] = JSON.stringify(data); } });
    S = fromShards(map);
  } else {
    Store.mode = 'local';
    try { const j = localStorage.getItem(KEY); S = j ? normalizeState(JSON.parse(j)) : emptyState(); } catch (e) { S = emptyState(); }
  }
}

/* alteração de dados: aplica, salva e redesenha */
function mutate(fn, opt = {}) {
  if (opt.undo) U.undo = JSON.stringify(S);
  fn(); schedulePersist(); render();
  if (opt.msg) toast(opt.msg, { undo: !!opt.undo });
}

/* =====================================================================
   INTERFACE BÁSICA: toast, modal, confirmação, dica flutuante
   ===================================================================== */
let toastT;
function toast(msg, opt = {}) {
  const root = $('#toastRoot');
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${opt.undo ? '<button class="btn sm ghost" type="button" data-act="undo">Desfazer</button>' : ''}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => { root.innerHTML = ''; }, opt.undo ? 8000 : 4000);
}
let modalState = null;
function openModal(o) {
  closeModal();
  const root = $('#modalRoot');
  root.innerHTML = `<div class="mback" data-act="mback"><form class="dlg ${o.wide ? 'wide' : ''}" id="mform" novalidate role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <header><h2 id="mtitle">${esc(o.title)}</h2><button type="button" class="icon-btn" data-act="closeModal" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="dlg-body">${o.body}<div class="ferr" id="mErr" hidden></div></div>
    <footer>${o.hideCancel ? '' : '<button type="button" class="btn" data-act="closeModal">' + esc(o.cancelLabel || 'Cancelar') + '</button>'}${o.hideSubmit ? '' : `<button type="submit" class="btn ${o.danger ? 'danger solid' : 'primary'}" id="mSubmit">${esc(o.submitLabel || 'Salvar')}</button>`}</footer></form></div>`;
  const form = $('#mform'); modalState = { o, form };
  document.documentElement.style.overflow = 'hidden';
  form.addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#mErr'); err.hidden = true;
    if (!o.onSubmit) { closeModal(); return; }
    let res; try { res = await o.onSubmit(form); } catch (ex) { res = 'Não foi possível concluir: ' + (ex && ex.message ? ex.message : 'erro inesperado'); }
    if (typeof res === 'string' && res) { err.textContent = res; err.hidden = false; err.scrollIntoView({ block: 'nearest' }); }
    else if (res !== false) closeModal();
  });
  if (o.onOpen) o.onOpen(form);
  const first = form.querySelector('input:not([type=hidden]):not([disabled]),select,textarea'); if (first && !o.noFocus) setTimeout(() => first.focus(), 30);
}
function closeModal() { $('#modalRoot').innerHTML = ''; modalState = null; document.documentElement.style.overflow = ''; }
function askConfirm({ title, text, ok = 'Confirmar', danger = false }) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    openModal({ title, body: `<p>${text}</p>`, submitLabel: ok, danger, noFocus: true, onSubmit: () => { fin(true); } });
    const mo = new MutationObserver(() => { if (!$('#mform')) { mo.disconnect(); fin(false); } });
    mo.observe($('#modalRoot'), { childList: true });
  });
}
function showTip(el, x, y) {
  const t = $('#tip'); t.textContent = el.dataset.tip; t.style.display = 'block';
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(x + 12, innerWidth - w - 8)) + 'px';
  t.style.top = Math.max(8, Math.min(y + 14, innerHeight - h - 8)) + 'px';
}
/* =====================================================================
   CÁLCULOS: contas, cartões, faturas, totais, metas, alertas e análises
   ===================================================================== */
const acc = id => S.accounts.find(a => a.id === id);
const isCardId = id => { const a = acc(id); return !!a && a.tipo === 'cartao'; };
const isCardTx = t => isCardId(t.contaId);
const cashAccounts = () => S.accounts.filter(a => a.tipo !== 'cartao');
const cardList = () => S.accounts.filter(a => a.tipo === 'cartao');
const descFull = t => t.parcela ? `${t.desc} (${t.parcela.n}/${t.parcela.total})` : t.desc;

/* situação de um lançamento: pago | recebido | pendente | atrasado | nacartao */
function txStatus(t) {
  const hoje = todayStr();
  if (t.tipo === 'receita') return t.status === 'recebido' ? 'recebido' : (t.data < hoje ? 'atrasado' : 'pendente');
  if (isCardTx(t)) return t.status === 'pago' ? 'pago' : 'nacartao';
  return t.status === 'pago' ? 'pago' : (t.data < hoje ? 'atrasado' : 'pendente');
}
const STATUS_LBL = { pago: 'Pago', recebido: 'Recebido', pendente: 'Pendente', atrasado: 'Atrasado', nacartao: 'Na fatura' };
const STATUS_CLS = { pago: 'inc', recebido: 'inc', pendente: 'info', atrasado: 'exp', nacartao: 'warn' };
function statusPill(t) {
  const s = txStatus(t); const lbl = (t.tipo === 'receita' && s === 'atrasado') ? 'Não recebida' : STATUS_LBL[s];
  return `<span class="pill ${STATUS_CLS[s]}">${lbl}</span>`;
}

/* ---- saldos ---- */
function saldoConta(a) {
  let c = Math.round((a.saldoInicial || 0) * 100);
  S.tx.forEach(t => {
    if (t.contaId !== a.id) return;
    if (t.tipo === 'receita' && t.status === 'recebido') c += Math.round(t.valor * 100);
    if (t.tipo === 'despesa' && t.status === 'pago' && !isCardTx(t)) c -= Math.round(t.valor * 100);
  });
  S.faturaPag.forEach(f => { if (f.contaId === a.id) c -= Math.round(f.valor * 100); });
  return c / 100;
}
function movimentosConta(a) {
  const m = [];
  S.tx.forEach(t => {
    if (t.contaId !== a.id) return;
    if (t.tipo === 'receita' && t.status === 'recebido') m.push({ d: t.dataPag || t.data, desc: descFull(t), v: t.valor });
    if (t.tipo === 'despesa' && t.status === 'pago' && !isCardTx(t)) m.push({ d: t.dataPag || t.data, desc: descFull(t), v: -t.valor });
  });
  S.faturaPag.forEach(f => { if (f.contaId === a.id) { const c = acc(f.cartaoId); m.push({ d: f.data, desc: 'Pagamento de fatura' + (c ? ' ' + c.nome : ''), v: -f.valor }); } });

}
function saldoTotal() {

/* dinheiro separado para objetivos (Wishlist e reserva de emergência) */
const wishReservado = w => sum(w.reservas || [], r => r.valor);

const disponivelGastos = () => r2(saldoTotal() - totalReservado());

/* ---- cartões e faturas ---- */
function faturaRef(card, d) {

  let ref = y + '-' + pad(m); if (dd > F) ref = addYM(ref, 1); return ref;
}
function faturaDatas(card, ref) {
  const y = +ref.slice(0, 4), m = +ref.slice(5, 7); const F = card.diaFechamento || 28, V = card.diaVencimento || 10;
  const fech = fmtYMD(y, m, Math.min(F, daysIn(y, m)));
  const vm = V <= F ? addYM(ref, 1) : ref; const vy = +vm.slice(0, 4), vmm = +vm.slice(5, 7);
  return { fech, venc: fmtYMD(vy, vmm, Math.min(V, daysIn(vy, vmm))) };
}
function faturas(card) {
  const map = {}, hoje = todayStr();
  S.tx.forEach(t => { if (t.contaId === card.id) { const r = faturaRef(card, t.data); (map[r] = map[r] || { ref: r, tx: [] }).tx.push(t); } });
  return Object.values(map).map(f => {

    f.paga = f.aberto === 0; f.status = f.paga ? 'paga' : (f.venc < hoje ? 'vencida' : (f.fech < hoje ? 'fechada' : 'aberta'));

}
const allFaturas = () => cardList().flatMap(faturas);
const cartaoUsado = card => sum(S.tx.filter(t => t.contaId === card.id && t.status !== 'pago'), t => t.valor);
const FAT_LBL = { aberta: 'Aberta', fechada: 'Fechada', vencida: 'Vencida', paga: 'Paga' };
const FAT_CLS = { aberta: 'info', fechada: 'warn', vencida: 'exp', paga: 'inc' };

/* ---- totais do mês ---- */
function stats(m) {
  const tx = S.tx.filter(t => ymOf(t.data) === m); const R = tx.filter(t => t.tipo === 'receita'), D = tx.filter(t => t.tipo === 'despesa');
  const rec = sum(R, t => t.valor), recOk = sum(R.filter(t => t.status === 'recebido'), t => t.valor);
  const desp = sum(D, t => t.valor), despOk = sum(D.filter(t => t.status === 'pago'), t => t.valor);
  return { rec, recOk, recPend: r2(rec - recOk), desp, despOk, despPend: r2(desp - despOk), saldo: r2(rec - desp), saldoReal: r2(recOk - despOk),
    econ: rec > 0 ? (rec - desp) / rec * 100 : null, n: tx.length };
}
function byCat(m, tipo = 'despesa') {
  const o = {}; S.tx.forEach(t => { if (t.tipo === tipo && ymOf(t.data) === m) o[t.categoria] = Math.round(((o[t.categoria] || 0) + t.valor) * 100) / 100; });
  return o;
}
const catMonth = (m, cat) => cat ? (byCat(m)[cat] || 0) : stats(m).desp;
/* contas a pagar do mês: despesas fora do cartão pendentes + faturas com vencimento no mês */
function aPagarMes(m) {
  const a = S.tx.filter(t => t.tipo === 'despesa' && !isCardTx(t) && t.status !== 'pago' && ymOf(t.data) === m);
  const f = allFaturas().filter(x => x.aberto > 0 && ymOf(x.venc) === m);
  return { total: r2(sum(a, t => t.valor) + sum(f, x => x.aberto)), n: a.length + f.length };
}
function aReceberMes(m) {
  const a = S.tx.filter(t => t.tipo === 'receita' && t.status !== 'recebido' && ymOf(t.data) === m);
  return { total: sum(a, t => t.valor), n: a.length };
}
function vencidas() {
  const hoje = todayStr();
  const a = S.tx.filter(t => t.tipo === 'despesa' && !isCardTx(t) && t.status !== 'pago' && t.data < hoje);
  const f = allFaturas().filter(x => x.aberto > 0 && x.venc < hoje);
  return { total: r2(sum(a, t => t.valor) + sum(f, x => x.aberto)), n: a.length + f.length, tx: a, fat: f };
}
/* média dos meses anteriores que têm movimento (até n meses) */
function mediaMeses(n = 3) {

  for (let i = 1; i <= n; i++) { const m = addYM(base, -i); const s = stats(m); if (s.n > 0) list.push({ m, ...s }); }
  if (!list.length) return null;

}
function mediaCat(cat, n = 3) {
  const base = curMonth(); let tot = 0, c = 0;
  for (let i = 1; i <= n; i++) { const m = addYM(base, -i); if (stats(m).n > 0) { tot += (byCat(m)[cat] || 0); c++; } }
  return c ? r2(tot / c) : null;
}

/* ---- fluxo de caixa: eventos realizados e previstos (projeção de saldo) ---- */
function cashEvents() {
  const hoje = todayStr(), ev = [];
  S.tx.forEach(t => {
    if (isCardTx(t)) return; const s = t.tipo === 'receita' ? 1 : -1;
    const ok = t.tipo === 'receita' ? t.status === 'recebido' : t.status === 'pago';
    if (ok) ev.push({ d: t.dataPag || t.data, v: s * t.valor, real: true });
    else ev.push({ d: t.data < hoje ? hoje : t.data, v: s * t.valor, real: false });
  });
  S.faturaPag.forEach(f => ev.push({ d: f.data, v: -f.valor, real: true }));
  allFaturas().forEach(f => { if (f.aberto > 0) ev.push({ d: f.venc < hoje ? hoje : f.venc, v: -f.aberto, real: false }); });
  return ev;
}
function balanceAt(date, planned, ev) {
  let c = Math.round(sum(cashAccounts(), a => a.saldoInicial || 0) * 100);
  ev.forEach(e => { if (e.d <= date && (e.real || planned)) c += Math.round(e.v * 100); });
  return c / 100;
}
/* série para gráficos de saldo: realizado até o mês atual, previsto depois */
function saldoSerie(back, fwd) {
  const ev = cashEvents(), cur = curMonth(), out = [];
  for (let i = -back; i <= fwd; i++) {
    const m = addYM(cur, i);
    if (i < 0) out.push({ label: monthShort(m), v: balanceAt(endOfMonth(m), false, ev), proj: false });
    else if (i === 0) out.push({ label: monthShort(m), v: saldoTotal(), proj: false, now: true });
    else out.push({ label: monthShort(m), v: balanceAt(endOfMonth(m), true, ev), proj: true });
  }
  return out;
}

/* ---- metas mensais ---- */
const goalAtualManual = g => r2((g.inicial || 0) + sum(g.aportes || [], a => a.valor));
function goalMonthEnded(g) { return endOfMonth(g.mes) < todayStr(); }
function goalProgress(g) {
  const hoje = todayStr(); let atual = 0, alvo = g.alvo || 0, reverse = false, nota = '';
  const s = stats(g.mes);
  if (g.tipo === 'economia') { atual = Math.max(0, r2(s.recOk - s.desp)); nota = 'Receitas recebidas menos despesas lançadas no mês'; }
  else if (g.tipo === 'limite') { atual = catMonth(g.mes, g.catDesp); reverse = true; nota = g.catDesp ? 'Despesas de ' + g.catDesp : 'Todas as despesas do mês'; }
  else if (g.tipo === 'reducao') {
    const prev = addYM(g.mes, -1); atual = Math.max(0, r2(catMonth(prev, g.catDesp) - catMonth(g.mes, g.catDesp)));
    nota = 'Gasto de ' + monthShort(prev) + ' menos o gasto do mês' + (g.catDesp ? ' em ' + g.catDesp : '');
  } else if (g.tipo === 'quitacao') {
    atual = sum(S.tx.filter(t => t.dividaId && t.status === 'pago' && ymOf(t.dataPag || t.data) === g.mes && (!g.debtId || t.dividaId === g.debtId)), t => t.valor);
    nota = 'Parcelas de dívidas pagas no mês';
  } else if (g.tipo === 'wishlist') {
    const w = S.wishlist.find(x => x.id === g.wishId);
    if (w) { atual = w.status === 'adquirido' ? w.valor : wishReservado(w); if (!alvo) alvo = w.valor; nota = 'Valor reservado para ' + w.nome; } else nota = 'Item da Wishlist removido';
  } else { atual = goalAtualManual(g); nota = 'Aportes registrados'; }
  const pct = alvo > 0 ? atual / alvo * 100 : 0;
  const restante = reverse ? r2(alvo - atual) : Math.max(0, r2(alvo - atual));
  let status;
  const ended = goalMonthEnded(g) || (g.limite && g.limite < hoje);
  if (reverse) status = atual > alvo ? 'nao_atingida' : (ended ? 'concluida' : (atual > 0 ? 'andamento' : 'nao_iniciada'));
  else status = pct >= 100 ? 'concluida' : (ended ? 'nao_atingida' : (atual > 0 ? 'andamento' : 'nao_iniciada'));
  return { atual, alvo, pct, restante, reverse, status, nota };
}
/* compatibilidade da meta com as receitas e despesas cadastradas */
function goalCompat(g, p) {
  const med = mediaMeses(3); const out = [];
  if (g.tipo === 'economia') {
    if (med && g.alvo > Math.max(0, med.saldo)) out.push({ sev: 'warn', t: `Sua sobra média nos últimos ${med.n} mês(es) foi ${money(med.saldo)}. A meta de ${money(g.alvo)} está acima dessa capacidade.` });
    else if (med) out.push({ sev: 'ok', t: `Compatível com a sobra média de ${money(med.saldo)} por mês.` });
    else out.push({ sev: 'info', t: 'Ainda não há meses anteriores para comparar. A avaliação melhora com o histórico.' });
  } else if (g.tipo === 'limite') {
    const ref = g.catDesp ? mediaCat(g.catDesp, 3) : (med ? med.desp : null);
    if (ref != null && g.alvo < ref * 0.9) out.push({ sev: 'warn', t: `O limite está ${pctf((1 - g.alvo / ref) * 100)} abaixo da média recente de gastos (${money(ref)}).` });
    else if (ref != null) out.push({ sev: 'ok', t: `Compatível com a média recente de gastos (${money(ref)}).` });
  } else if (g.tipo === 'reducao') {
    const prev = catMonth(addYM(g.mes, -1), g.catDesp);
    if (prev > 0 && g.alvo > prev) out.push({ sev: 'warn', t: `A redução desejada (${money(g.alvo)}) é maior que o gasto do mês anterior (${money(prev)}).` });
    else if (prev === 0) out.push({ sev: 'info', t: 'Não há gastos no mês anterior para servir de base.' });
  } else if (g.tipo === 'wishlist' || g.tipo === 'emergencia' || g.tipo === 'patrimonio') {
    const falta = Math.max(0, r2(p.alvo - p.atual));
    if (falta > 0 && med) { const m = Math.max(1, monthsBetween(curMonth(), ymOf(g.limite || endOfMonth(g.mes))) + 1);
      const need = r2(falta / m);
      if (need > Math.max(0, med.saldo)) out.push({ sev: 'warn', t: `Para fechar até o prazo é preciso guardar cerca de ${money(need)} por mês, acima da sua sobra média de ${money(med.saldo)}.` });
      else out.push({ sev: 'ok', t: `Guardar ${money(need)} por mês cabe na sua sobra média de ${money(med.saldo)}.` }); }
  }
  return out;
}

/* ---- dívidas ---- */
const debtTx = d => S.tx.filter(t => t.dividaId === d.id).sort((a, b) => a.data < b.data ? -1 : 1);
function debtInfo(d) {
  const tx = debtTx(d), pagasTx = tx.filter(t => t.status === 'pago');
  const pagas = (d.pagasAntes || 0) + pagasTx.length, restantes = Math.max(0, d.parcelas - pagas);

  const saldo = sum(tx.filter(t => t.status !== 'pago'), t => t.valor);

/* valor presente das parcelas restantes (com juros mensais, se houver) */
function pvParcelas(k, p, i) { return i > 0 ? p * (1 - Math.pow(1 + i, -k)) / i : p * k; }
function mesesParaQuitar(saldoPV, pagamento, i) {

/* ---- alertas automáticos ---- */
function buildAlerts() {
  const out = [], hoje = todayStr(), dias = S.settings.alertDias || 3, lim = addDays(hoje, dias);
  const add = (sev, title, text, go) => out.push({ sev, title, text, go });
  S.tx.filter(t => t.tipo === 'despesa' && !isCardTx(t) && t.status !== 'pago').sort((a, b) => a.data < b.data ? -1 : 1).forEach(t => {
    if (t.data < hoje) add('danger', 'Conta atrasada: ' + descFull(t), `Venceu em ${fmtDate(t.data)} (${diffDays(t.data, hoje)} dia(s) de atraso). Valor ${money(t.valor)}.`, 'despesas');
    else if (t.data <= lim) add('warn', 'Conta perto do vencimento: ' + descFull(t), `Vence ${t.data === hoje ? 'hoje' : 'em ' + fmtDate(t.data)}. Valor ${money(t.valor)}.`, 'despesas');
  });

    if (f.venc < hoje) add('danger', `Fatura vencida: ${f.card.nome}`, `Venceu em ${fmtDate(f.venc)}. Valor em aberto ${money(f.aberto)}.`, 'contas');
    else if (f.venc <= lim) add('warn', `Fatura perto do vencimento: ${f.card.nome}`, `Vence ${f.venc === hoje ? 'hoje' : 'em ' + fmtDate(f.venc)}. Valor ${money(f.aberto)}.`, 'contas');
  });
  const m = curMonth(), gastos = byCat(m);
  Object.keys(S.budgets).forEach(c => {
    const l = S.budgets[c]; if (!(l > 0)) return; const g = gastos[c] || 0;
    if (g >= l) add('danger', `Limite de ${c} atingido`, `Você gastou ${money(g)} de ${money(l)} neste mês${g > l ? ` (${money(g - l)} acima)` : ''}.`, 'planejamento');
    else if (g >= l * 0.85) add('warn', `Limite de ${c} quase no fim`, `Já foram ${money(g)} de ${money(l)} (${pctf(g / l * 100)}).`, 'planejamento');
  });
  cardList().forEach(c => { if (c.limite > 0) { const u = cartaoUsado(c); if (u >= c.limite * 0.9) add('warn', `Limite do cartão ${c.nome} quase esgotado`, `${money(u)} usados de ${money(c.limite)}.`, 'contas'); } });
  S.tx.filter(t => t.tipo === 'receita' && t.status !== 'recebido' && t.data <= hoje).forEach(t =>
    add('warn', 'Receita prevista ainda não recebida: ' + descFull(t), `Prevista para ${fmtDate(t.data)}. Valor ${money(t.valor)}.`, 'receitas'));
  S.goals.forEach(g => { if (g.mes === curMonth() || g.mes === addYM(curMonth(), -1)) { const p = goalProgress(g);
    if (p.status === 'concluida' && !p.reverse) add('ok', 'Meta alcançada: ' + g.nome, `Você chegou a ${money(p.atual)} de ${money(p.alvo)}.`, 'metas'); } });
  S.wishlist.forEach(w => { if (w.status !== 'adquirido' && w.status !== 'cancelado' && w.valor > 0 && wishReservado(w) >= w.valor) add('ok', 'Wishlist: valor reservado completo', `${w.nome} já tem o valor reservado. Falta registrar a compra.`, 'wishlist'); });

}

/* ---- análises do assistente ---- */
function analyze() {
  const out = [], cur = curMonth(), s = stats(cur), med = mediaMeses(3), prev = stats(addYM(cur, -1));
  const add = (sev, title, text) => out.push({ sev, title, text });
  if (!S.tx.length) return [{ sev: 'info', title: 'Ainda não há movimentações', text: 'Cadastre receitas e despesas para receber análises baseadas nos seus dados reais.' }];
  if (s.rec > 0 && s.desp > s.rec) add('danger', 'Despesas acima das receitas neste mês', `As despesas somam ${money(s.desp)} e as receitas ${money(s.rec)}. O resultado do mês é ${money(s.saldo)}.`);
  else if (s.rec > 0) add(s.econ >= 20 ? 'ok' : (s.econ >= 5 ? 'info' : 'warn'), `Taxa de economia do mês: ${pctf(s.econ)}`, `Sobram ${money(s.saldo)} das receitas de ${money(s.rec)}. ${s.econ < 10 ? 'Uma meta usual é guardar ao menos 10% a 20% do que entra.' : 'Bom ritmo de poupança.'}`);
  if (med && med.n >= 1 && s.desp > med.desp * 1.2 && s.desp - med.desp > 50) add('warn', 'Gastos acima do seu padrão', `As despesas deste mês (${money(s.desp)}) estão ${pctf((s.desp / med.desp - 1) * 100)} acima da média dos últimos ${med.n} mês(es) (${money(med.desp)}).`);
  const gastos = byCat(cur);
  Object.keys(gastos).forEach(c => { const m = mediaCat(c, 3); if (m != null && m > 0 && gastos[c] > m * 1.3 && gastos[c] - m > 50) add('warn', `${c} acima da média`, `${money(gastos[c])} neste mês contra média de ${money(m)} (${pctf((gastos[c] / m - 1) * 100)} a mais).`); });
  Object.keys(S.budgets).forEach(c => { const l = S.budgets[c]; if (l > 0 && (gastos[c] || 0) > l) add('danger', `Orçamento de ${c} estourado`, `${money(gastos[c])} gastos para um limite de ${money(l)}.`); });
  /* despesas que merecem revisão: assinaturas e gastos pequenos repetidos */
  const subs = S.tx.filter(t => t.tipo === 'despesa' && ymOf(t.data) === cur && (t.categoria === 'Assinaturas'));
  if (subs.length) add('info', `${subs.length} assinatura(s) no mês`, `Somam ${money(sum(subs, t => t.valor))} por mês (${money(sum(subs, t => t.valor) * 12)} por ano). Cancele as que você usa pouco.`);
  const grp = {}; S.tx.filter(t => t.tipo === 'despesa' && ymOf(t.data) === cur && ['Alimentação', 'Lazer', 'Compras', 'Transporte'].includes(t.categoria) && !t.recId).forEach(t => { const k = norm(t.desc); (grp[k] = grp[k] || { desc: t.desc, n: 0, v: 0 }); grp[k].n++; grp[k].v += t.valor; });
  Object.values(grp).filter(x => x.n >= 3).sort((a, b) => b.v - a.v).slice(0, 3).forEach(x => add('info', `"${x.desc}" apareceu ${x.n} vezes`, `Compras repetidas somam ${money(x.v)} no mês. Vale ver se cabe reduzir a frequência.`));
  const disc = sum(Object.keys(gastos).filter(c => DISCRETIONARY.includes(c)), c => gastos[c]);
  if (s.desp > 0 && disc / s.desp > 0.3) add('info', 'Gastos não essenciais pesam no orçamento', `Lazer, compras e assinaturas somam ${money(disc)} (${pctf(disc / s.desp * 100)} das despesas do mês).`);
  /* problemas financeiros */
  const v = vencidas(); if (v.n) add('danger', `${v.n} conta(s) vencida(s)`, `Total em atraso: ${money(v.total)}. Regularize para evitar juros e multa.`);
  const ev = cashEvents(); for (let i = 0; i <= 3; i++) { const m = addYM(cur, i); const b = balanceAt(endOfMonth(m), true, ev); if (b < 0) { add('danger', 'Saldo previsto negativo', `Pelos lançamentos cadastrados, o saldo no fim de ${monthLabel(m)} fica em ${money(b)}.`); break; } }
  const mensalDiv = sum(S.debts.filter(d => debtInfo(d).restantes > 0), d => d.valorParcela);
  const recRef = s.rec || (med ? med.rec : 0);
  if (mensalDiv > 0 && recRef > 0) { const p = mensalDiv / recRef * 100; add(p > 30 ? 'warn' : 'info', `Parcelas de dívidas: ${pctf(p)} da renda`, `As parcelas mensais somam ${money(mensalDiv)}. ${p > 30 ? 'Acima de 30% da renda costuma apertar o orçamento.' : 'Dentro de um nível administrável.'}`); }
  const despMed = med ? med.desp : s.desp;
  if (despMed > 0) { const meses = saldoTotal() / despMed; add(meses < 3 ? 'warn' : 'ok', `Colchão financeiro: ${num1(Math.max(0, meses))} mês(es) de despesas`, `Seu saldo em contas cobre ${num1(Math.max(0, meses))} mês(es) do gasto médio de ${money(despMed)}. O recomendado costuma ser de 3 a 6 meses.`); }
  if (prev.n && s.n) add('info', 'Comparação com o mês anterior', `Receitas: ${money(s.rec)} (antes ${money(prev.rec)}). Despesas: ${money(s.desp)} (antes ${money(prev.desp)}). Resultado: ${money(s.saldo)} (antes ${money(prev.saldo)}).`);
  return out;
}
/* limites sugeridos: média dos 3 meses anteriores com 5% de folga a menos */
function sugerirLimites() {

/* =====================================================================
   GRÁFICOS EM SVG (escala única, cores pelos tokens do tema)
   ===================================================================== */
function niceScale(min, max, ticks = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, raw = span / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / mag, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
  return { lo, hi, ticks: t };
}
const axisFmt = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? num1(a / 1e6) + ' mi' : a >= 1e4 ? num1(a / 1e3) + ' mil' : a >= 1e3 ? (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : Math.round(a).toLocaleString('pt-BR')); };

/* barras agrupadas: receitas x despesas */
function barChart(data, { h = 230 } = {}) {
  if (!data.length || data.every(d => !d.a && !d.b)) return `<div class="empty"><p>Sem valores no período para desenhar o gráfico.</p></div>`;
  const W = 640, L = 54, R = 8, T = 10, B = 26, pw = W - L - R, ph = h - T - B;
  const sc = niceScale(0, Math.max(...data.map(d => Math.max(d.a, d.b)), 1), 4);
  const y = v => T + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;
  const gw = pw / data.length, bw = Math.min(26, gw * 0.34);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Receitas e despesas por período">`;
  sc.ticks.forEach(t => { s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${axisFmt(t)}</text>`; });
  const every = Math.ceil(data.length / 12);
  data.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    s += `<rect class="bar b-inc" x="${cx - bw - 1}" y="${y(d.a)}" width="${bw}" height="${Math.max(0, y(0) - y(d.a))}" rx="2" data-tip="${esc(d.label)} · Receitas: ${money(d.a)}"/>`;
    s += `<rect class="bar b-exp" x="${cx + 1}" y="${y(d.b)}" width="${bw}" height="${Math.max(0, y(0) - y(d.b))}" rx="2" data-tip="${esc(d.label)} · Despesas: ${money(d.b)}"/>`;
    if (i % every === 0) s += `<text class="ax" x="${cx}" y="${h - 8}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return s + `</svg><div class="leg"><span><i class="dot" style="background:var(--inc)"></i>Receitas</span><span><i class="dot" style="background:var(--exp)"></i>Despesas</span></div>`;
}

/* linha com área; pontos previstos em tracejado */
function lineChart(pts, { h = 220, fmt = money, name = 'Saldo' } = {}) {
  if (!pts.length) return '';
  const W = 640, L = 54, R = 14, T = 12, B = 26, pw = W - L - R, ph = h - T - B;
  const vals = pts.map(p => p.v), sc = niceScale(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const x = i => L + (pts.length === 1 ? pw / 2 : i * pw / (pts.length - 1)), y = v => T + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(name)} ao longo do tempo">`;
  sc.ticks.forEach(t => { s += `<line class="${t === 0 ? 'zl' : 'gl'}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${axisFmt(t)}</text>`; });
  const real = pts.map((p, i) => ({ ...p, i })).filter(p => !p.proj), proj = pts.map((p, i) => ({ ...p, i })).filter((p, k, a) => p.proj || (a[k + 1] && a[k + 1].proj));
  const path = arr => arr.map((p, k) => (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  if (real.length > 1) s += `<path class="area" d="${path(real)} L${x(real[real.length - 1].i)} ${y(0)} L${x(real[0].i)} ${y(0)}Z"/>`;
  if (real.length > 1) s += `<path class="ln" d="${path(real)}"/>`;
  if (proj.length > 1) s += `<path class="ln proj" d="${path(proj)}"/>`;
  const every = Math.ceil(pts.length / 10);
  pts.forEach((p, i) => {
    const last = i === pts.length - 1 || p.now;
    s += `<circle class="pt ${p.now ? 'end' : ''}" cx="${x(i)}" cy="${y(p.v)}" r="${last ? 4.5 : 3.5}" data-tip="${esc(p.label)}${p.proj ? ' (previsto)' : p.now ? ' (hoje)' : ''} · ${fmt(p.v)}"/>`;
    if (i % every === 0 || i === pts.length - 1) s += `<text class="ax" x="${x(i)}" y="${h - 8}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return s + `</svg>` + (pts.some(p => p.proj) ? `<div class="leg"><span><i class="dot" style="background:var(--accent)"></i>Realizado</span><span>Linha tracejada: previsto com os lançamentos cadastrados</span></div>` : '');
}

/* rosca de categorias com legenda */
function donut(items, total) {
  items = items.filter(i => i.v > 0).sort((a, b) => b.v - a.v);
  if (!items.length) return `<div class="empty"><p>Nenhuma despesa no período.</p></div>`;
  const tot = total || sum(items, i => i.v), R0 = 70, r = 46, cx = 84, cy = 84; let a0 = -Math.PI / 2, s = `<svg viewBox="0 0 168 168" role="img" aria-label="Distribuição por categoria">`;
  items.forEach(i => {
    const f = i.v / tot, a1 = a0 + f * Math.PI * 2, big = f > 0.5 ? 1 : 0;
    const p = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    if (f >= 0.9999) s += `<circle cx="${cx}" cy="${cy}" r="${(R0 + r) / 2}" fill="none" stroke="${i.color}" stroke-width="${R0 - r}" data-tip="${esc(i.label)} · ${money(i.v)} (100%)"/>`;
    else s += `<path d="M${p(R0, a0)} A${R0} ${R0} 0 ${big} 1 ${p(R0, a1)} L${p(r, a1)} A${r} ${r} 0 ${big} 0 ${p(r, a0)}Z" fill="${i.color}" data-tip="${esc(i.label)} · ${money(i.v)} (${pctf(f * 100)})"/>`;
    a0 = a1;
  });
  s += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="ax">Total</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" style="font:500 12px var(--font-mono);fill:var(--fg)">${esc(money(tot))}</text></svg>`;
  const leg = items.map(i => `<div><i class="dot" style="background:${i.color}"></i><span class="grow">${esc(i.label)}</span><span class="num">${pctf(i.v / tot * 100)}</span></div>`).join('');
  return `<div class="donut-wrap">${s}<div class="donut-leg">${leg}</div></div>`;
}

/* barras horizontais simples (categorias) */
function catBars(items) {
  const mx = Math.max(...items.map(i => i.v), 1);
  return `<div class="stack" style="gap:9px">${items.map(i => `<div class="catbar"><span style="overflow-wrap:anywhere"><i class="dot" style="background:${i.color};margin-right:6px"></i>${esc(i.label)}</span><div class="prog"><i style="width:${(i.v / mx * 100).toFixed(1)}%;background:${i.color}"></i></div><span class="num">${money(i.v)}</span></div>`).join('')}</div>`;
}
const prog = (pct, cls = '') => `<div class="prog ${cls}" role="progressbar" aria-valuenow="${Math.round(Math.min(100, Math.max(0, pct)))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100, Math.max(0, pct)).toFixed(1)}%"></i></div>`;

const kpi = (l, v, s, cls = '', hero = false) => `<div class="kpi ${hero ? 'hero' : ''}"><span class="l">${l}</span><span class="v ${cls}">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
function delta(cur, prev, bad) {
  if (!prev) return '<span class="delta flat">sem base no mês anterior</span>';
  const p = (cur - prev) / Math.abs(prev) * 100; if (Math.abs(p) < 0.05) return '<span class="delta flat">igual ao mês anterior</span>';
  const up = p > 0, good = bad ? !up : up;
  return `<span class="delta ${good ? 'up' : 'down'}">${up ? '▲' : '▼'} ${pctf(Math.abs(p))} vs mês anterior</span>`;
}

function proximos(n = 7, days = 15) {

/* =====================================================================
   RECEITAS E DESPESAS
   ===================================================================== */
function inPeriod(d, f) {
  if (f.mode === 'mes') return ymOf(d) === f.ref;
  if (f.mode === 'ano') return d.slice(0, 4) === f.ref.slice(0, 4);
  if (f.mode === 'intervalo') return (!f.de || d >= f.de) && (!f.ate || d <= f.ate);
  return true;
}
function periodBar(key, cats, stOpts) {
  const f = U.f[key]; let nav = '';
  if (f.mode === 'mes') nav = `<button class="btn sm" type="button" data-act="fnav" data-k="${key}" data-dir="-1" aria-label="Mês anterior">‹</button><strong class="nowrap" style="min-width:128px;text-align:center">${capital(monthLabel(f.ref))}</strong><button class="btn sm" type="button" data-act="fnav" data-k="${key}" data-dir="1" aria-label="Próximo mês">›</button>`;
  else if (f.mode === 'ano') nav = `<button class="btn sm" type="button" data-act="fnav" data-k="${key}" data-dir="-1" aria-label="Ano anterior">‹</button><strong>${f.ref.slice(0, 4)}</strong><button class="btn sm" type="button" data-act="fnav" data-k="${key}" data-dir="1" aria-label="Próximo ano">›</button>`;
  else if (f.mode === 'intervalo') nav = `<input type="date" class="sel" id="${key}-de" data-fm="${key}.de" value="${f.de}" aria-label="De"> <span class="sub">até</span> <input type="date" class="sel" id="${key}-ate" data-fm="${key}.ate" value="${f.ate}" aria-label="Até">`;
  const so = '<option value="">Todas as situações</option>' + stOpts.map(([v, l]) => `<option value="${v}" ${f.status === v ? 'selected' : ''}>${l}</option>`).join('');
  return `<div class="filters"><select class="sel" id="${key}-mode" data-fm="${key}.mode" aria-label="Período"><option value="mes" ${f.mode === 'mes' ? 'selected' : ''}>Por mês</option><option value="ano" ${f.mode === 'ano' ? 'selected' : ''}>Por ano</option><option value="intervalo" ${f.mode === 'intervalo' ? 'selected' : ''}>Intervalo</option><option value="tudo" ${f.mode === 'tudo' ? 'selected' : ''}>Todo o período</option></select>${nav}
  <select class="sel" id="${key}-cat" data-fm="${key}.cat" aria-label="Categoria"><option value="">Todas as categorias</option>${cats.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
  <select class="sel" id="${key}-st" data-fm="${key}.status" aria-label="Situação">${so}</select>
  <input type="search" class="sel" id="${key}-q" data-fm="${key}.q" value="${esc(f.q)}" placeholder="Buscar" aria-label="Buscar"></div>`;
}
function txRow(t) {

  const meta = [`${isR ? 'Receb.' : card ? 'Compra' : 'Venc.'} ${fmtDate(t.data)}`, t.categoria, isR && t.origem ? t.origem : null, a ? a.nome : null, card ? 'Fatura de ' + monthShort(faturaRef(a, t.data)) : null,
    t.parcela ? `Parcela ${t.parcela.n}/${t.parcela.total}` : (t.recId ? 'Recorrente' : null), t.dataPag && (st === 'pago' || st === 'recebido') ? `${isR ? 'recebida' : 'paga'} em ${fmtDate(t.dataPag)}` : null].filter(Boolean).join(' · ');
  const quick = (!card && st !== 'pago' && st !== 'recebido') ? `<button class="btn sm" type="button" data-act="quickPay" data-id="${t.id}">${isR ? 'Receber' : 'Pagar'}</button>` : '';
  return `<div class="tx"><div class="d"><div class="t">${esc(descFull(t))}</div><div class="m">${esc(meta)}</div>${t.obs ? `<div class="m">${esc(t.obs)}</div>` : ''}</div><div class="st">${statusPill(t)}</div><div class="val ${isR ? 'inc' : 'exp'}">${isR ? '+' : '−'}${money(t.valor)}</div><div class="acts">${quick}<button class="btn sm ghost" type="button" data-act="editTx" data-id="${t.id}">Editar</button><button class="btn sm ghost danger" type="button" data-act="delTx" data-id="${t.id}">Excluir</button></div></div>`;
}
function vTx(tipo) {
  const isR = tipo === 'receita', key = isR ? 'receitas' : 'despesas', f = U.f[key];
  let list = S.tx.filter(t => t.tipo === tipo && inPeriod(t.data, f));
  if (f.cat) list = list.filter(t => t.categoria === f.cat);
  if (f.status) list = list.filter(t => txStatus(t) === f.status);
  if (f.q) { const q = norm(f.q); list = list.filter(t => norm(descFull(t) + ' ' + (t.obs || '') + ' ' + (t.origem || '')).includes(q)); }
  const asc = f.mode === 'mes' || f.mode === 'intervalo';
  list.sort((a, b) => (a.data === b.data ? 0 : (a.data < b.data ? -1 : 1)) * (asc ? 1 : -1));
  const tot = sum(list, t => t.valor), ok = sum(list.filter(t => ['pago', 'recebido'].includes(txStatus(t))), t => t.valor), late = sum(list.filter(t => txStatus(t) === 'atrasado'), t => t.valor);
  const stOpts = isR ? [['recebido', 'Recebida'], ['pendente', 'Pendente'], ['atrasado', 'Não recebida']] : [['pago', 'Paga'], ['pendente', 'Pendente'], ['atrasado', 'Atrasada'], ['nacartao', 'Na fatura do cartão']];
  let h = `<div class="bar-row" style="justify-content:space-between"><p class="sub">${isR ? 'Entradas de dinheiro, recorrentes e parceladas.' : 'Contas, compras no cartão e parcelamentos.'}</p><button class="btn primary" type="button" data-act="newTx" data-tipo="${tipo}">${isR ? 'Nova receita' : 'Nova despesa'}</button></div>`;
  h += `<div class="grid gauto">${kpi(isR ? 'Total previsto' : 'Total lançado', money(tot), `${list.length} lançamento(s) no filtro`, isR ? 'inc' : 'exp')}${kpi(isR ? 'Recebido' : 'Pago', money(ok), '', isR ? 'inc' : '')}${kpi(isR ? 'A receber' : 'A pagar', money(r2(tot - ok)), '')}${kpi(isR ? 'Não recebido no prazo' : 'Em atraso', money(late), '', late ? 'exp' : '')}</div>`;
  h += `<div class="panel"><div class="panel-h">${periodBar(key, isR ? CAT_R : CAT_D, stOpts)}</div>`;
  if (!list.length) h += S.tx.some(t => t.tipo === tipo) ? emptyBox('Nada encontrado com esses filtros', 'Mude o período, a categoria ou a situação para ver outros lançamentos.') : emptyBox(isR ? 'Nenhuma receita cadastrada' : 'Nenhuma despesa cadastrada', isR ? 'Cadastre salário e outras entradas para acompanhar o que entra.' : 'Cadastre suas contas e compras para acompanhar o que sai.', `<button class="btn primary" type="button" data-act="newTx" data-tipo="${tipo}">${isR ? 'Nova receita' : 'Nova despesa'}</button>`);
  else { h += `<div class="rows">${list.slice(0, f.lim).map(txRow).join('')}</div>`; if (list.length > f.lim) h += `<div style="text-align:center;padding-top:12px"><button class="btn" type="button" data-act="more" data-k="${key}">Mostrar mais (${list.length - f.lim} restantes)</button></div>`; }
  return h + '</div>';

VIEWS.receitas = () => vTx('receita');
VIEWS.despesas = () => vTx('despesa');

/* ---- formulário de lançamento ---- */
function genSeries(base, rep, qtd) {
  if (rep === 'unico' || !qtd) return [{ ...base, id: uid() }];
  const gid = uid(), out = [], cents = Math.round(base.valor * 100), per = Math.floor(cents / qtd), rem = cents - per * qtd;
  for (let i = 0; i < qtd; i++) {
    const t = { ...base, id: uid(), recId: gid };
    if (rep === 'parcelado') { t.valor = (per + (i < rem ? 1 : 0)) / 100; t.parcela = { n: i + 1, total: qtd }; t.data = addMonths(base.data, i); }
    else { t.recMode = rep; t.data = rep === 'mensal' ? addMonths(base.data, i) : rep === 'semanal' ? addDays(base.data, 7 * i) : addMonths(base.data, 12 * i); }
    if (i > 0) { t.status = 'pendente'; t.dataPag = ''; }
    out.push(t);
  }
  return out;
}

  const done = isR ? 'recebido' : 'pago';

    <div class="field"><label for="tf-data" id="tf-data-l">${isR ? 'Data de recebimento *' : 'Data de vencimento *'}</label><input type="date" id="tf-data" name="data" value="${v.data}" min="1990-01-01" max="2100-12-31"></div>

        const hint = $$('tf-card-hint'); hint.hidden = !card;
        if (card && validDate(f.data.value)) { const c = acc(f.contaId.value), ref = faturaRef(c, f.data.value), d = faturaDatas(c, ref); hint.textContent = `Esta compra entra na fatura de ${monthLabel(ref)} (fecha em ${fmtDate(d.fech)} e vence em ${fmtDate(d.venc)}).`; }
        if (f.rep) { const r = f.rep.value; $$('tf-qtd-w').hidden = r === 'unico'; $$('tf-qtd-l').textContent = r === 'parcelado' ? 'Número de parcelas' : 'Quantas ocorrências gerar';

}
A.newTx = d => openTxForm(d.tipo);
A.editTx = d => { const t = S.tx.find(x => x.id === d.id); if (t) openTxForm(t.tipo, t.id); };
A.quickPay = d => {
  const t = S.tx.find(x => x.id === d.id); if (!t) return;
  mutate(() => { t.status = t.tipo === 'receita' ? 'recebido' : 'pago'; t.dataPag = todayStr(); }, { msg: t.tipo === 'receita' ? 'Receita marcada como recebida' : 'Despesa marcada como paga', undo: true });

A.delTx = async d => {

  if (t.dividaId) { toast('As parcelas de dívidas são gerenciadas na aba Dívidas.'); return; }

    openModal({ title: 'Excluir lançamento da série', danger: true, submitLabel: 'Excluir', body: `<p><strong>${esc(descFull(t))}</strong> faz parte de uma série.</p><label class="chk"><input type="radio" name="escopo" value="um" checked> Somente este lançamento</label><label class="chk"><input type="radio" name="escopo" value="seguintes"> Este e os próximos (${ns})</label><label class="chk"><input type="radio" name="escopo" value="todos"> A série inteira (${n})</label>`,
      onSubmit(form) { const e = form.querySelector('[name=escopo]:checked').value; const ids = new Set((e === 'um' ? [t] : S.tx.filter(x => x.recId === t.recId && (e === 'todos' || x.data >= t.data))).map(x => x.id));

  }
  if (await askConfirm({ title: 'Excluir lançamento', text: `Excluir <strong>${esc(descFull(t))}</strong> (${money(t.valor)})? Os indicadores serão recalculados.`, ok: 'Excluir', danger: true }))

/* =====================================================================
   CALENDÁRIO FINANCEIRO
   ===================================================================== */
function calEvents() {
  const map = {}, add = (d, e) => { (map[d] = map[d] || []).push(e); };
  S.tx.forEach(t => { if (isCardTx(t)) return; const done = ['pago', 'recebido'].includes(txStatus(t)); add(t.data, { k: t.tipo, desc: descFull(t), v: t.valor, done, late: txStatus(t) === 'atrasado' }); });
  allFaturas().forEach(f => add(f.venc, { k: 'fatura', desc: 'Fatura ' + f.card.nome, v: f.total, done: f.paga, late: f.status === 'vencida' }));
  return map;
}

/* =====================================================================

function parceladasCartao(card) {
  const g = {};
  S.tx.filter(t => t.contaId === card.id && t.parcela).forEach(t => { (g[t.recId] = g[t.recId] || []).push(t); });
  return Object.values(g).map(a => { a.sort((x, y) => x.parcela.n - y.parcela.n); const rest = a.filter(t => t.status !== 'pago');
    return { desc: a[0].desc, total: a[0].parcela.total, pagas: a.length - rest.length, valorParc: a[0].valor, restante: sum(rest, t => t.valor), rest: rest.length }; }).filter(x => x.rest > 0);
}

VIEWS.planejamento = function () {
  const m = U.planMonth, cur = curMonth(), s = stats(cur), gastos = byCat(m), lim = S.budgets, hoje = todayStr();
  const ano = cur.slice(0, 4); let econAno = 0; for (let i = 1; i <= 12; i++) { const st = stats(ano + '-' + pad(i)); econAno += st.recOk - st.desp; } econAno = Math.max(0, r2(econAno));

    ${mM > 0 ? `<div class="stack" style="gap:6px;margin-top:12px">${prog(econMes / mM * 100, econMes >= mM ? 'inc' : '')}<span class="sub">${monthLabel(cur)}: ${money(econMes)} de ${money(mM)} · ${econMes >= mM ? 'meta alcançada' : 'faltam ' + money(mM - econMes)}</span></div>` : '<p class="hint" style="margin-top:8px">Informe um valor para acompanhar o progresso do mês.</p>'}</div>
    <div class="panel"><div class="panel-h"><h3>Meta de economia anual</h3></div><div class="field"><label for="meta-ano">Quanto quer guardar em ${ano} (R$)</label><input id="meta-ano" data-set="metaEconomiaAnual" inputmode="decimal" value="${mA ? inputMoney(mA) : ''}" placeholder="0,00"></div>
    ${mA > 0 ? `<div class="stack" style="gap:6px;margin-top:12px">${prog(econAno / mA * 100, econAno >= mA ? 'inc' : '')}<span class="sub">Guardado no ano: ${money(econAno)} de ${money(mA)} · ${econAno >= mA ? 'meta alcançada' : 'faltam ' + money(mA - econAno)}</span></div>` : '<p class="hint" style="margin-top:8px">Soma o que sobrou (receitas recebidas menos despesas) em cada mês do ano.</p>'}</div></div>`;
  /* limites por categoria */
  const over = CAT_D.filter(c => lim[c] > 0 && (gastos[c] || 0) > lim[c]);
  h += `<div class="panel"><div class="panel-h"><div><h3>Limite de gastos por categoria</h3><span class="sub">O limite vale para todos os meses. O acompanhamento abaixo é de ${monthLabel(m)}.</span></div><div class="bar-row">${monthNav('planNav', m)}<button class="btn sm" type="button" data-act="sugerirLimites">Sugerir limites</button></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Categoria</th><th>Limite mensal (R$)</th><th class="r">Gasto no mês</th><th style="min-width:130px">Uso do limite</th><th>Situação</th></tr></thead><tbody>${CAT_D.map(c => { const l = lim[c] || 0, g = gastos[c] || 0, p = l > 0 ? g / l * 100 : 0;
    return `<tr><td><i class="dot" style="background:${catColor(c)};margin-right:6px"></i>${esc(c)}</td><td><input class="inp" style="max-width:130px" id="bud-${CAT_D.indexOf(c)}" data-bud="${esc(c)}" inputmode="decimal" value="${l ? inputMoney(l) : ''}" placeholder="sem limite" aria-label="Limite de ${esc(c)}"></td><td class="r num">${money(g)}</td><td>${l > 0 ? prog(p, p >= 100 ? 'exp' : p >= 85 ? 'warn' : 'inc') : '<span class="sub">—</span>'}</td><td>${l > 0 ? (g > l ? `<span class="pill exp">${money(g - l)} acima</span>` : p >= 85 ? `<span class="pill warn">${pctf(p)} usado</span>` : `<span class="pill inc">${pctf(p)} usado</span>`) : '<span class="sub">Defina um limite</span>'}</td></tr>`; }).join('')}</tbody></table></div>
  ${over.length ? `<div class="alert danger" style="margin-top:12px"><span class="ic"></span><div class="grow"><div class="at">Gastos acima do planejado em ${monthLabel(m)}</div><div class="ax2">${over.map(c => `${c}: ${money(gastos[c])} para um limite de ${money(lim[c])} (${money(gastos[c] - lim[c])} acima)`).join(' · ')}</div></div></div>` : (Object.keys(lim).length ? '<p class="sub" style="margin-top:12px">Nenhuma categoria acima do limite neste mês.</p>' : '')}</div>`;
  /* projeção de saldo */

    const entra = sum(ev.filter(e => !e.real && e.v > 0 && ymOf(e.d) === mm), e => e.v), sai = sum(ev.filter(e => !e.real && e.v < 0 && ymOf(e.d) === mm), e => -e.v);

    return `<tr><td>${esc(w.nome)}</td><td class="r num">${money(w.valor)}</td><td class="r num">${money(r)}</td><td>${w.prazo ? fmtDate(w.prazo) : '<span class="sub">sem prazo</span>'}</td><td class="r num">${need == null ? (w.prazo ? '<span class="exp">prazo vencido</span>' : '—') : money(need)}</td><td>${need == null || !med ? '<span class="sub">—</span>' : need <= Math.max(0, med.saldo) ? '<span class="pill inc">Cabe</span>' : '<span class="pill warn">Acima da sobra</span>'}</td></tr>`; }).join('')}</tbody></table></div>${med ? `<p class="sub" style="margin-top:8px">Sobra média dos últimos ${med.n} mês(es): ${money(med.saldo)}.</p>` : '<p class="sub" style="margin-top:8px">A coluna “Cabe na sobra?” aparece quando houver meses anteriores com lançamentos.</p>'}` : emptyBox('Nenhuma compra planejada', 'Adicione itens com valor e prazo na Wishlist para ver quanto guardar por mês.', '<button class="btn" type="button" data-act="newWish">Adicionar desejo</button>')}</div>`;
  return h;
};

const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch (e) { return null; } };
const wishAtivo = w => !['adquirido', 'cancelado'].includes(w.status);
const PRIO_CLS = { alta: 'exp', media: 'warn', baixa: 'info' };

function wishCard(w) {
  const r = wishReservado(w), pc = w.valor > 0 ? Math.min(100, r / w.valor * 100) : 0, ativo = wishAtivo(w), falta = Math.max(0, r2(w.valor - r));
  const g = S.goals.find(x => x.id === w.metaId), url = w.link ? safeUrl(w.link) : null;
  let prazo = '';
  if (w.prazo && ativo) { const ms = w.prazo >= todayStr() ? mesesAte(w.prazo) : 0; prazo = w.prazo < todayStr() ? `<span class="exp">Prazo vencido em ${fmtDate(w.prazo)}</span>` : `Prazo ${fmtDate(w.prazo)} · guardar ${money(r2(falta / ms))} por mês`; }
  const img = w.img ? `<img src="${esc(w.img)}" alt="${esc(w.nome)}" loading="lazy">` : `<div class="ph" style="background:var(--accent-soft);color:var(--accent)">${esc((w.nome || '?').charAt(0).toUpperCase())}</div>`;
  return `<div class="wcard"><div class="wimg">${img}</div><div class="wbody">
    <div class="bar-row"><span class="pill ${PRIO_CLS[w.prioridade] || ''}">Prioridade ${PRIO[w.prioridade] || ''}</span><span class="pill ${w.status === 'adquirido' ? 'inc' : w.status === 'cancelado' ? '' : 'info'}">${WSTATUS[w.status]}</span></div>

    <div class="bar-row" style="justify-content:space-between"><span class="num" style="font-size:1.15rem">${money(w.status === 'adquirido' && w.valorPago ? w.valorPago : w.valor)}</span><span class="sub">${esc(w.categoria)}</span></div>
    ${ativo ? `${prog(pc, pc >= 100 ? 'inc' : '')}<div class="bar-row" style="justify-content:space-between"><span class="sub">${money(r)} reservados · ${pctf(pc)}</span><span class="sub">Falta ${money(falta)}</span></div>` : (w.status === 'adquirido' ? `<span class="sub">Adquirido em ${fmtDate(w.adquiridoEm)}</span>` : '')}
    ${prazo ? `<span class="sub">${prazo}</span>` : ''}
    <span class="sub">Adicionado em ${fmtDate(w.adicionado)}${url ? ` · <a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${esc(url.hostname.replace(/^www\./, ''))}</a>` : ''}</span>
    ${g ? `<span class="pill info" style="align-self:flex-start">Meta: ${esc(g.nome)}</span>` : ''}
    <div class="bar-row" style="margin-top:auto;padding-top:6px">${ativo ? `<button class="btn sm primary" type="button" data-act="wishReserve" data-id="${w.id}">Reservar</button>${r > 0 ? `<button class="btn sm" type="button" data-act="wishWithdraw" data-id="${w.id}">Retirar</button>` : ''}<button class="btn sm" type="button" data-act="wishBuy" data-id="${w.id}">Adquirido</button>${g ? '' : `<button class="btn sm" type="button" data-act="wishGoal" data-id="${w.id}">Criar meta</button>`}` : `<button class="btn sm" type="button" data-act="wishReopen" data-id="${w.id}">Reabrir</button>`}<button class="btn sm ghost" type="button" data-act="editWish" data-id="${w.id}">Editar</button><button class="btn sm ghost danger" type="button" data-act="delWish" data-id="${w.id}">Excluir</button></div></div></div>`;
}
VIEWS.wishlist = function () {

  let list = S.wishlist.slice();
