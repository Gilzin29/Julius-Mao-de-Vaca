  if (wf.q) { const q = norm(wf.q); list = list.filter(w => norm(w.nome + ' ' + (w.desc || '')).includes(q)); }
  const ord = { prioridade: (a, b) => PRIO_W[a.prioridade] - PRIO_W[b.prioridade] || b.valor - a.valor, maior: (a, b) => b.valor - a.valor, menor: (a, b) => a.valor - b.valor, prazo: (a, b) => (a.prazo || '9999') < (b.prazo || '9999') ? -1 : 1, recente: (a, b) => a.adicionado < b.adicionado ? 1 : -1 };

    <select class="sel" id="wf-ord" data-wf="ord" aria-label="Ordenar"><option value="prioridade" ${wf.ord === 'prioridade' ? 'selected' : ''}>Ordenar por prioridade</option><option value="maior" ${wf.ord === 'maior' ? 'selected' : ''}>Maior valor</option><option value="menor" ${wf.ord === 'menor' ? 'selected' : ''}>Menor valor</option><option value="prazo" ${wf.ord === 'prazo' ? 'selected' : ''}>Prazo mais próximo</option><option value="recente" ${wf.ord === 'recente' ? 'selected' : ''}>Adicionados recentemente</option></select>
    <label class="chk"><input type="checkbox" id="wf-group" data-wf="group" ${wf.group ? 'checked' : ''}> Agrupar por categoria</label><input type="search" class="sel" id="wf-q" data-wf="q" value="${esc(wf.q)}" placeholder="Buscar" aria-label="Buscar"></div></div>`;

  }
  if (/(quanto).*(recebi|ganhei|receita|entrou)|receita/.test(q) && !/pendente/.test(q)) { const m = findMonth(q), s = stats(m); return P(`Em ${monthLabel(m)} as receitas somam <strong>${money(s.rec)}</strong>: ${money(s.recOk)} recebidos e ${money(s.recPend)} a receber.`); }
  if (/saldo|dinheiro|disponivel|tenho/.test(q) && !/previsto|futuro|projec/.test(q)) return P(`Saldo em contas: <strong>${money(saldoTotal())}</strong>. Reservado para objetivos: ${money(totalReservado())}. Disponível para gastos: <strong>${money(disponivelGastos())}</strong>.`);
  if (/(maior|maiores|mais).*(gasto|despesa|categoria)|onde.*(gast|vai)/.test(q)) { const m = findMonth(q), c = byCat(m), l = Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, 5); if (!l.length) return P('Sem despesas em ' + monthLabel(m) + '.'); const t = stats(m).desp; return P(`Maiores gastos em ${monthLabel(m)}:`) + `<ul>${l.map(k => `<li>${esc(k)}: <strong>${money(c[k])}</strong> (${pctf(c[k] / t * 100)})</li>`).join('')}</ul>`; }
  if (/(vencid|atrasad|atraso)/.test(q)) { const v = vencidas(); return v.n ? P(`Você tem <strong>${v.n}</strong> item(ns) vencido(s), somando <strong>${money(v.total)}</strong>.`) + `<ul>${v.tx.slice(0, 6).map(t => `<li>${esc(descFull(t))}: ${money(t.valor)} (venceu em ${fmtDate(t.data)})</li>`).join('')}${v.fat.map(f => `<li>Fatura ${esc(f.card.nome)}: ${money(f.aberto)} (venceu em ${fmtDate(f.venc)})</li>`).join('')}</ul>` : P('Nenhuma conta vencida. Tudo em dia.'); }
  if (/(a pagar|pagar|proxim|vencer|vence)/.test(q)) { const p = proximos(8, 30).filter(x => x.k !== 'receita'); return p.length ? P(`Próximos pagamentos (30 dias):`) + `<ul>${p.map(x => `<li>${fmtDate(x.d)}: ${esc(x.desc)}, <strong>${money(x.v)}</strong></li>`).join('')}</ul>` : P('Não há pagamentos previstos nos próximos 30 dias.'); }
  if (/(a receber|pendente|prevista)/.test(q)) { const r = aReceberMes(cur); return P(`Receitas ainda não recebidas em ${monthLabel(cur)}: <strong>${money(r.total)}</strong> (${r.n} lançamento(s)).`); }
  if (/(economi|poupan|sobr)/.test(q) && !/dica|sugest/.test(q)) { const m = findMonth(q), s = stats(m); return s.rec ? P(`Em ${monthLabel(m)} sobram <strong>${money(s.saldo)}</strong> das receitas, uma taxa de economia de <strong>${pctf(s.econ)}</strong>.`) : P('Sem receitas lançadas em ' + monthLabel(m) + '.'); }
  if (/(compar|mes passado|anterior)/.test(q)) { const s = stats(cur), p = stats(addYM(cur, -1)); return P(`${capital(monthLabel(cur))} contra ${monthLabel(addYM(cur, -1))}:`) + `<ul><li>Receitas: ${money(s.rec)} (antes ${money(p.rec)})</li><li>Despesas: ${money(s.desp)} (antes ${money(p.desp)})</li><li>Resultado: ${money(s.saldo)} (antes ${money(p.saldo)})</li></ul>`; }
  if (/(previst|futuro|projec|vai ficar|fim do mes)/.test(q)) { const ev = cashEvents(); return P(`Saldo previsto no fim de ${monthLabel(cur)}: <strong>${money(balanceAt(endOfMonth(cur), true, ev))}</strong>.`) + P(`Daqui a 3 meses (${monthLabel(addYM(cur, 3))}): <strong>${money(balanceAt(endOfMonth(addYM(cur, 3)), true, ev))}</strong>. Considera apenas o que já está lançado, incluindo recorrentes e parcelas.`); }
  if (/(divida|financiamento|emprestimo)/.test(q)) { const a = S.debts.map(d => ({ d, i: debtInfo(d) })).filter(x => x.i.restantes > 0); return a.length ? P(`Saldo devedor total: <strong>${money(sum(a, x => x.i.saldo))}</strong> em ${a.length} dívida(s), com parcelas de ${money(sum(a, x => x.d.valorParcela))} por mês.`) : P('Você não tem dívidas ativas cadastradas.'); }
  if (/(cartao|fatura|limite)/.test(q)) { const c = cardList(); return c.length ? `<ul>${c.map(x => `<li>${esc(x.nome)}: usado ${money(cartaoUsado(x))} de ${money(x.limite)}, disponível <strong>${money(x.limite - cartaoUsado(x))}</strong></li>`).join('')}</ul>` : P('Nenhum cartão cadastrado.'); }
  if (/(meta|objetivo)/.test(q)) { const g = S.goals.filter(x => x.mes === cur); return g.length ? `<ul>${g.map(x => { const p = goalProgress(x); return `<li>${esc(x.nome)}: ${money(p.atual)} de ${money(p.alvo)} (${pctf(p.pct)}), ${p.reverse ? 'restam ' : 'faltam '}${money(Math.abs(p.restante))}</li>`; }).join('')}</ul>` : P('Não há metas para este mês.'); }
  if (/(wishlist|desejo|comprar)/.test(q)) { const w = S.wishlist.filter(wishAtivo); return w.length ? P(`Wishlist em aberto: <strong>${money(sum(w, x => x.valor))}</strong> em ${w.length} item(ns), com ${money(sum(w, wishReservado))} já reservados.`) : P('Sua Wishlist não tem itens em aberto.'); }
  if (/(dica|sugest|recomend|ajust|analis|problema|desnecess|excess|habito|ajuda|como estou)/.test(q)) { const a = analyze(); return `<ul>${a.slice(0, 7).map(x => `<li><strong>${esc(x.title)}.</strong> ${esc(x.text)}</li>`).join('')}</ul>`; }
  return P('Não entendi essa pergunta. Tente algo como:') + '<ul><li>Quanto gastei com alimentação neste mês?</li><li>Quanto posso economizar se reduzir meus gastos em 15%?</li><li>Quais são meus maiores gastos?</li><li>Tenho contas vencidas?</li><li>Como ficará meu saldo no fim do mês?</li><li>Compare com o mês passado</li></ul>';
}
VIEWS.assistente = function () {
  const cur = curMonth(), an = analyze(), sug = ['Quanto gastei com alimentação neste mês?', 'Quanto posso economizar se reduzir meus gastos em 15%?', 'Quais são meus maiores gastos?', 'Tenho contas vencidas?', 'Como ficará meu saldo no fim do mês?', 'Compare com o mês passado'];
  const ords = { danger: 0, warn: 1, info: 2, ok: 3 };
  let h = `<div class="grid gwide"><div class="panel"><div class="panel-h"><h3>Pergunte sobre suas finanças</h3></div><div class="chatlog" id="chatlog" aria-live="polite">${U.chat.length ? U.chat.map(m => `<div class="msg ${m.r}">${m.r === 'u' ? esc(m.t) : m.t}</div>`).join('') : '<div class="msg a"><p>Respondo com cálculos feitos sobre os lançamentos cadastrados. Escolha uma pergunta ou escreva a sua.</p></div>'}</div>
    <div class="bar-row" style="margin:12px 0">${sug.map(s => `<button class="btn sm" type="button" data-act="ask" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <form id="askForm" class="bar-row" style="flex-wrap:nowrap"><input class="inp grow" id="askInp" placeholder="Digite sua pergunta" autocomplete="off" aria-label="Pergunta"><button class="btn primary" type="submit">Perguntar</button></form></div>
    <div class="panel"><div class="panel-h"><h3>Simulador de economia</h3></div><div class="fgrid"><div class="field"><label for="sim-pct">Reduzir gastos em (%)</label><input type="number" id="sim-pct" min="1" max="100" value="${U.simPct}" data-sim="pct"></div><div class="field"><label for="sim-cat">Categoria</label><select id="sim-cat" data-sim="cat"><option value="">Todas as despesas</option>${opts(CAT_D, U.simCat)}</select></div></div>${(() => { const base = U.simCat ? (byCat(cur)[U.simCat] || 0) : stats(cur).desp, e = r2(base * (U.simPct || 0) / 100); return base ? `<div class="grid gauto" style="margin-top:12px"><div class="stack" style="gap:2px"><span class="sub">Base do mês</span><span class="num">${money(base)}</span></div><div class="stack" style="gap:2px"><span class="sub">Economia por mês</span><span class="num inc">${money(e)}</span></div><div class="stack" style="gap:2px"><span class="sub">Economia por ano</span><span class="num inc">${money(e * 12)}</span></div></div>` : '<p class="sub" style="margin-top:12px">Sem despesas neste mês para simular.</p>'; })()}</div></div>`;
  h += `<div class="panel"><div class="panel-h"><h3>Análise dos seus hábitos</h3><span class="sub">Gerada dos lançamentos reais</span></div><div class="stack">${an.sort((a, b) => ords[a.sev] - ords[b.sev]).map(a => `<div class="alert ${a.sev}"><span class="ic"></span><div class="grow"><div class="at">${esc(a.title)}</div><div class="ax2">${esc(a.text)}</div></div></div>`).join('')}</div></div>`;
  const sg = sugerirLimites(), ks = Object.keys(sg);
  if (ks.length) h += `<div class="panel"><div class="panel-h"><h3>Ajustes sugeridos no orçamento</h3><button class="btn sm" type="button" data-act="sugerirLimites">Aplicar limites sugeridos</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Categoria</th><th class="r">Média dos últimos meses</th><th class="r">Limite sugerido</th><th class="r">Limite atual</th></tr></thead><tbody>${ks.map(k => `<tr><td>${esc(k)}</td><td class="r num">${money(mediaCat(k, 3))}</td><td class="r num">${money(sg[k])}</td><td class="r num">${S.budgets[k] ? money(S.budgets[k]) : '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
};
function ask(t) { t = (t || '').trim(); if (!t) return; U.chat.push({ r: 'u', t }); U.chat.push({ r: 'a', t: answer(t) }); render(); const l = $('#chatlog'); if (l) l.scrollTop = l.scrollHeight; }
A.ask = d => ask(d.q);

/* ---- backup e ajustes ---- */
VIEWS.backup = function () {
  const ub = S.settings.ultimoBackup, n = S.tx.length;
  return `<div class="grid gwide"><div class="panel"><div class="panel-h"><h3>Backup dos dados</h3></div><p class="sub" style="margin-bottom:12px">${Store.mode === 'cloud' ? 'Seus dados ficam salvos na sua conta, em área privada. Mesmo assim, guarde cópias de segurança.' : 'Neste ambiente os dados ficam apenas neste navegador. Limpar os dados do navegador apaga tudo. Exporte um backup com frequência.'}</p>
    <div class="stack" style="gap:6px;margin-bottom:12px"><span>${n} lançamento(s), ${S.accounts.length} conta(s), ${S.debts.length} dívida(s), ${S.goals.length} meta(s), ${S.wishlist.length} desejo(s).</span><span class="sub">Último backup: ${ub ? fmtDate(ub) : 'nunca exportado'}.</span></div>
    <div class="bar-row"><button class="btn primary" type="button" data-act="exportBackup">Exportar backup (JSON)</button><button class="btn" type="button" data-act="exportCSV">Exportar lançamentos (CSV)</button></div></div>
    <div class="panel"><div class="panel-h"><h3>Recuperar dados</h3></div><p class="sub" style="margin-bottom:12px">Importe um arquivo de backup para restaurar. Os dados atuais serão substituídos, por isso a página pede confirmação.</p><div class="field"><label for="bk-file">Arquivo de backup (.json)</label><input type="file" id="bk-file" accept=".json,application/json"></div></div></div>
  <div class="panel"><div class="panel-h"><h3>Ajustes</h3></div><div class="field" style="max-width:320px"><label for="set-dias">Avisar vencimentos com antecedência de (dias)</label><input type="number" id="set-dias" min="0" max="30" value="${S.settings.alertDias}" data-set="alertDias"></div></div>
  <div class="panel"><div class="panel-h"><h3>Apagar tudo</h3></div><p class="sub" style="margin-bottom:12px">Remove todos os dados do sistema. Exporte um backup antes.</p><button class="btn danger" type="button" data-act="wipe">Apagar todos os dados</button></div>`;
};
A.exportBackup = async () => { if (await saveFile(`backup-gestor-financeiro-${todayStr()}.json`, JSON.stringify({ app: 'gestor-financeiro', exportadoEm: new Date().toISOString(), dados: S }, null, 1))) mutate(() => { S.settings.ultimoBackup = todayStr(); }, { msg: 'Backup exportado' }); };
A.exportCSV = async () => {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', rows = [['Data', 'Tipo', 'Descrição', 'Categoria', 'Conta', 'Situação', 'Valor', 'Data do pagamento', 'Observações'].map(q).join(';')];
  S.tx.slice().sort((a, b) => a.data < b.data ? -1 : 1).forEach(t => rows.push([fmtDate(t.data), t.tipo, descFull(t), t.categoria, (acc(t.contaId) || {}).nome || '', STATUS_LBL[txStatus(t)], String(t.valor).replace('.', ','), t.dataPag ? fmtDate(t.dataPag) : '', t.obs || ''].map(q).join(';')));
  if (await saveFile(`lancamentos-${todayStr()}.csv`, '﻿' + rows.join('\r\n'))) toast('CSV exportado');
};
function importBackup(file) {
  const fr = new FileReader(); fr.onerror = () => toast('Não foi possível ler o arquivo.');
  fr.onload = async () => {
    let obj; try { obj = JSON.parse(fr.result); } catch (e) { toast('O arquivo não é um backup válido.'); return; }
    const d = obj && obj.dados ? obj.dados : obj; if (!d || typeof d !== 'object' || !Array.isArray(d.tx) || !Array.isArray(d.accounts)) { toast('Este arquivo não parece um backup do Gestor Financeiro.'); return; }
    const ns = normalizeState(d);
    if (await askConfirm({ title: 'Restaurar backup', ok: 'Restaurar', danger: true, text: `O backup tem ${ns.tx.length} lançamento(s), ${ns.accounts.length} conta(s), ${ns.goals.length} meta(s) e ${ns.wishlist.length} desejo(s). Os dados atuais serão substituídos.` })) mutate(() => { S = ns; }, { msg: 'Backup restaurado' });
  };
  fr.readAsText(file);
}
A.wipe = async () => { if (await askConfirm({ title: 'Apagar todos os dados', ok: 'Apagar tudo', danger: true, text: 'Todos os lançamentos, contas, dívidas, metas e desejos serão removidos. Você poderá desfazer logo em seguida, mas exporte um backup para garantir.' })) mutate(() => { S = emptyState(); }, { msg: 'Dados apagados', undo: true }); };

/* ---- eventos globais ---- */
A.go = d => go(d.v); A.goAlertas = () => go('alertas');
A.openSide = () => { U.side = true; render(); }; A.closeSide = () => { U.side = false; render(); };
A.closeModal = () => closeModal();
A.mback = (d, e) => { if (e.target.classList.contains('mback')) closeModal(); };
A.undo = () => { if (!U.undo) return; try { S = normalizeState(JSON.parse(U.undo)); } catch (e) { return; } U.undo = null; schedulePersist(); render(); toast('Alteração desfeita'); };
A.retrySave = () => { if (Store.status === 'error') { Store.dirty = true; setSaveState('saving'); flush(); } };
A.dashNav = d => { U.dashMonth = addYM(U.dashMonth, +d.dir); render(); }; A.calNav = d => { U.calMonth = addYM(U.calMonth, +d.dir); U.calDay = null; render(); };
A.planNav = d => { U.planMonth = addYM(U.planMonth, +d.dir); render(); }; A.metaNav = d => { U.metaMonth = addYM(U.metaMonth, +d.dir); render(); };
A.calDay = d => { U.calDay = U.calDay === d.d ? null : d.d; render(); };
A.fnav = d => { const f = U.f[d.k]; f.ref = f.mode === 'ano' ? addMonths(f.ref + '-01', 12 * +d.dir).slice(0, 7) : addYM(f.ref, +d.dir); f.lim = 80; render(); };
A.more = d => { U.f[d.k].lim += 80; render(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') return; f(el.dataset, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fm) { const [k, key] = t.dataset.fm.split('.'), f = U.f[k]; f[key] = t.value; f.lim = 80; if (key === 'mode' && t.value === 'mes' && !/^\d{4}-\d{2}$/.test(f.ref)) f.ref = curMonth(); render(); }
  else if (t.dataset.wf) { U.wf[t.dataset.wf] = t.type === 'checkbox' ? t.checked : t.value; render(); }
  else if (t.dataset.bud !== undefined) { const v = t.value.trim() === '' ? 0 : parseMoney(t.value); if (isNaN(v) || v < 0) { toast('Limite inválido. Use o formato 1.234,56.'); render(); return; } mutate(() => { if (v > 0) S.budgets[t.dataset.bud] = v; else delete S.budgets[t.dataset.bud]; }); }
  else if (t.dataset.set) { const k = t.dataset.set; if (k === 'alertDias') { const n = parseInt(t.value, 10); if (!(n >= 0 && n <= 30)) { toast('Informe de 0 a 30 dias.'); render(); return; } mutate(() => { S.settings.alertDias = n; }); }
    else { const v = t.value.trim() === '' ? 0 : parseMoney(t.value); if (isNaN(v) || v < 0) { toast('Valor inválido. Use o formato 1.234,56.'); render(); return; } mutate(() => { S.settings[k] = v; }); } }
  else if (t.dataset.sim) { if (t.dataset.sim === 'pct') U.simPct = Math.max(0, Math.min(100, +t.value || 0)); else U.simCat = t.value; render(); }
  else if (t.id === 'bk-file' && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
});
let sT; document.addEventListener('input', e => {
  const t = e.target; if (t.dataset.fm && t.type === 'search') { clearTimeout(sT); sT = setTimeout(() => { const [k, key] = t.dataset.fm.split('.'); U.f[k][key] = t.value; U.f[k].lim = 80; render(); }, 220); }
  else if (t.dataset.wf === 'q') { clearTimeout(sT); sT = setTimeout(() => { U.wf.q = t.value; render(); }, 220); }
});
document.addEventListener('submit', e => { if (e.target.id === 'askForm') { e.preventDefault(); const i = $('#askInp'); const v = i.value; i.value = ''; ask(v); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (modalState) closeModal(); else if (U.side) { U.side = false; render(); } } });
document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else $('#tip').style.display = 'none'; });
document.addEventListener('mouseleave', () => { $('#tip').style.display = 'none'; });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== U.view) { U.view = v; U.side = false; render(); } });
window.addEventListener('beforeunload', () => { if (Store.dirty) { try { if (Store.mode === 'local') localStorage.setItem(KEY, JSON.stringify(S)); else flush(); } catch (e) { } } });
document.addEventListener('visibilitychange', () => { if (document.hidden && Store.dirty) flush(); });

/* ---- inicialização ---- */
async function boot(forceLocal) {
  $('#view').innerHTML = '<div class="loading">Carregando seus dados…</div>';
  try { await loadStorage(forceLocal); }
  catch (e) {
    $('#view').innerHTML = `<div class="panel"><div class="empty"><h3>Não foi possível carregar seus dados</h3><p>A conexão com o armazenamento falhou. Nada foi apagado. Tente de novo; se o problema continuar, use o armazenamento deste navegador.</p><div class="bar-row"><button class="btn primary" type="button" id="retryBoot">Tentar de novo</button><button class="btn" type="button" id="localBoot">Usar este navegador</button></div></div></div>`;
    $('#retryBoot').onclick = () => boot(false); $('#localBoot').onclick = () => boot(true); return;
  }
  const v = location.hash.slice(1); if (VIEWS[v]) U.view = v;
  setSaveState('saved'); render();
}
A.dummy = () => { };
boot(false);
</script>

</body></html>
